name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate CI session secret
        run: printf 'SESSION_SECRET=%s\n' "$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Build
        env:
          DATABASE_URL: file:../db/custom.db
        run: npm run build
